<!doctype html>
<html lang="{{language}}">
<meta charset="utf-8">
<title>BeeCount</title>
<style>
  @font-face { font-family: PosterTitle; src: url('{{titleFont}}') format('truetype'); font-weight: 800; }
  @font-face { font-family: PosterCaption; src: url('{{captionFont}}') format('truetype'); font-weight: 500; }
  * { box-sizing: border-box; }
  html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  main {
    --ink: #35200d; --minor: #573711; --paper: #ffc947; --edge: #edaa28; --lit: #ffe799; --ghost: #fff4ce;
    position: relative; isolation: isolate;
    background: radial-gradient(ellipse at 2% 0%,var(--lit) 0,transparent 58%), linear-gradient(160deg,var(--paper) 22%,var(--edge));
    color: var(--ink);
  }
  main[data-scene="server"] {
    --ink: #fff9db; --minor: #d6e3c0; --paper: #1b4039; --edge: #142e2b; --lit: #365a49; --ghost: #69816c;
  }
  main[data-scene="backup"] {
    --ink: #263e32; --minor: #415243; --paper: #f2eddb; --edge: #e1d6ac; --lit: #fffaf0; --ghost: #fbf6e7;
  }
  header { position: absolute; left: 7.0%; right: 5.8%; top: 4.7%; }
  h1 {
    margin: 0; font-family: PosterTitle, sans-serif; font-size: 11.9vw; line-height: 0.99; font-weight: 800;
    letter-spacing: -0.052em; font-kerning: normal;
  }
  h1 span { display: block; white-space: nowrap; }
  html:lang(zh) h1 { font-size: 11.5vw; line-height: 1.12; letter-spacing: -0.04em; }
  p { color:var(--minor); margin: 3.6vw 0 0; font:500 3.37vw/1.3 PosterCaption,sans-serif; }
  .frame {
    position: absolute; left: 6.1%; right: 6.1%; top: 28.2%; border-radius: 6vw;
    box-shadow: 0 3vw 8vw -2.6vw #26170955;
    aspect-ratio: 1206 / 2622;
  }
  .frame::before {
    content:''; position:absolute; z-index:-1; inset:2vw -1.05vw -1vw 1.8vw; border-radius:6vw;
    background:var(--ghost); transform:rotate(1.6deg); transform-origin:50% 80%;
  }
  img {
    display:block; width:100%; height:auto; border-radius:6vw; outline:1px solid #ffffff62;
    outline-offset:-1px;
  }
</style>
<main data-scene="{{scene}}">
  <header><h1><span></span><span></span></h1><p></p></header>
  <div class="frame"><img src="{{screen}}" alt=""></div>
</main>
</html>
