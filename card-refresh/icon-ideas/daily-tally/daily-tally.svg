<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 每日一笔（卡通萌版）</title>
  <desc id="description">深墨青底上一张米白记账便签卡，顶端两枚朱红装订扣，右上角停着一只圆脸腮红的卡通小蜜蜂。</desc>
  <rect id="background" width="256" height="256" fill="#17333D"/>

  <!-- Ledger card / daily pad -->
  <g id="daily-pad">
    <rect x="40" y="68" width="144" height="148" rx="24" fill="#FFFDF7"/>
    <!-- Two vermilion top binding tabs -->
    <rect x="66" y="52" width="18" height="32" rx="9" fill="#EE5533"/>
    <rect x="114" y="52" width="18" height="32" rx="9" fill="#EE5533"/>

    <!-- Three bold entry bars + vermilion dot -->
    <rect x="66" y="110" width="82" height="14" rx="7" fill="#253E48"/>
    <rect x="66" y="140" width="90" height="14" rx="7" fill="#253E48"/>
    <rect x="66" y="170" width="54" height="14" rx="7" fill="#253E48"/>
    <circle cx="146" cy="177" r="8.5" fill="#EE5533"/>
  </g>

  <!-- Chubby, adorable 3/4 cartoon bumblebee perched on the upper-right corner -->
  <g id="cartoon-bee" transform="translate(184 78)">
    <!-- Soft puffy wings swept up-right -->
    <path d="M 10 -14 C 14 -38 38 -48 48 -36 C 56 -26 42 -6 20 -2 Z" fill="#EFE8D8" stroke="#3B2316" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -2 -16 C -4 -42 18 -54 30 -42 C 42 -30 28 -8 6 -6 Z" fill="#FFFFFF" stroke="#3B2316" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Plump golden-yellow egg body with two rounded cocoa-brown stripes -->
    <g transform="rotate(14)">
      <defs>
        <ellipse id="dt-body" cx="12" cy="8" rx="28" ry="22"/>
        <clipPath id="dt-body-clip"><use href="#dt-body"/></clipPath>
      </defs>
      <use href="#dt-body" fill="#FFC928"/>
      <g clip-path="url(#dt-body-clip)">
        <path d="M 6 -16 C 12 -2 12 18 6 34 L 15 34 C 21 18 21 -2 15 -16 Z" fill="#3B2316"/>
        <path d="M 24 -12 C 29 0 29 16 24 28 L 32 28 C 36 16 36 0 32 -12 Z" fill="#3B2316"/>
        <ellipse cx="12" cy="26" rx="26" ry="10" fill="#F29F05" opacity="0.45"/>
      </g>
      <use href="#dt-body" fill="none" stroke="#3B2316" stroke-width="4.8"/>
      <!-- Tiny cute tail nub -->
      <path d="M 38 6 L 45 9 L 38 14 Z" fill="#3B2316"/>
    </g>

    <!-- Chubby mochi cartoon head looking affectionately toward the card -->
    <g transform="translate(-14 0)">
      <!-- Two short bouncy antennae (warm gold so they pop against #17333D) -->
      <path d="M -6 -19 C -10 -31 -20 -35 -26 -30" fill="none" stroke="#FFC928" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="-27" cy="-29" r="4.5" fill="#FFC928"/>
      <path d="M 6 -20 C 5 -32 -1 -38 -7 -35" fill="none" stroke="#FFC928" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="-8" cy="-34" r="4.2" fill="#FFC928"/>

      <path d="
        M 0 -22
        C 16 -22 26 -12 27 2
        C 28 15 19 24 4 25
        C -12 26 -24 18 -25 4
        C -26 -11 -16 -22 0 -22 Z" fill="#FFC928" stroke="#3B2316" stroke-width="4.8"/>

      <!-- Expressive big eyes + sparkle -->
      <circle cx="-11" cy="1" r="5" fill="#3B2316"/>
      <circle cx="-12.5" cy="-0.8" r="1.9" fill="#FFFFFF"/>
      <circle cx="8" cy="2" r="5" fill="#3B2316"/>
      <circle cx="6.5" cy="0.2" r="1.9" fill="#FFFFFF"/>

      <!-- Rosy cheeks & tiny happy smile -->
      <ellipse cx="-18" cy="9" rx="5" ry="3.2" fill="#FF8468" opacity="0.82"/>
      <ellipse cx="14" cy="10" rx="5" ry="3.2" fill="#FF8468" opacity="0.82"/>
      <path d="M -5 9 Q -1.5 13 2 9" fill="none" stroke="#3B2316" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
