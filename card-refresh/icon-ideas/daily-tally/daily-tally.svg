<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 每日一笔</title>
  <desc id="description">深墨青底上一张米白记账便签卡，顶端两枚朱红装订扣，右上角停着一只回头看账目的金黄小蜂。</desc>
  <rect id="background" width="256" height="256" fill="#13323B"/>

  <!-- Ledger card / daily pad shifted slightly left-down so corner bee sits cleanly -->
  <g id="daily-pad">
    <rect x="42" y="68" width="144" height="146" rx="22" fill="#FFF6E5"/>
    <!-- Two vermilion top binding tabs well clear of the right corner -->
    <rect x="68" y="52" width="18" height="32" rx="9" fill="#EE5834"/>
    <rect x="116" y="52" width="18" height="32" rx="9" fill="#EE5834"/>

    <!-- Three bold entry bars + vermilion check dot -->
    <rect x="68" y="108" width="84" height="14" rx="7" fill="#13323B"/>
    <rect x="68" y="138" width="92" height="14" rx="7" fill="#13323B"/>
    <rect x="68" y="168" width="56" height="14" rx="7" fill="#13323B"/>
    <circle cx="148" cy="175" r="8.5" fill="#EE5834"/>
  </g>

  <!-- Plump golden honeybee perched on the upper-right corner facing inward toward the card -->
  <g id="corner-bee" transform="translate(186 76) rotate(22)">
    <!-- Wings swept upward-right (bright ivory against dark petrol background) -->
    <path d="M 6 -12 C 4 -32 18 -46 30 -39 C 40 -33 32 -13 15 -8 Z" fill="#E6DEC8"/>
    <path d="M -5 -13 C -2 -34 10 -46 21 -38 C 30 -31 20 -12 4 -8 Z" fill="#FFF8EC"/>

    <!-- Bee silhouette facing left-down toward the ledger card -->
    <path d="M -32 4 C -32 -12 -19 -22 0 -22 C 19 -22 33 -11 33 5 C 33 19 20 28 1 28 C -17 28 -32 18 -32 4 Z" fill="#13323B"/>
    <!-- Golden saffron body segments -->
    <path d="M -25 4 C -25 -9 -14 -17 2 -17 C 18 -17 28 -8 28 5 C 28 16 17 23 1 23 C -14 23 -25 15 -25 4 Z" fill="#FFBA1A"/>
    <!-- Two crisp dark stripes -->
    <path d="M 3 -17 C 8 -4 8 11 3 23" fill="none" stroke="#13323B" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M 18 -13 C 22 -2 22 9 18 19" fill="none" stroke="#13323B" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Dark head on the left looking down at the pad -->
    <circle cx="-20" cy="4" r="14" fill="#13323B"/>
    <circle cx="-24" cy="2" r="3" fill="#FFF6E5"/>
    <!-- Bright saffron antenna so it pops cleanly against #13323B -->
    <path d="M -23 -8 C -27 -18 -36 -21 -40 -15" fill="none" stroke="#FFBA1A" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
