<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 每日一笔</title>
  <desc id="description">深墨青底上一张米白记账便签卡，顶端两枚朱红装订扣，右上角轻落着一只圆滚滚的金黄小蜂。</desc>
  <rect id="background" width="256" height="256" fill="#13323B"/>

  <!-- Ledger card / daily pad -->
  <g id="daily-pad">
    <rect x="42" y="68" width="144" height="146" rx="22" fill="#FFF6E5"/>
    <!-- Two vermilion top binding tabs -->
    <rect x="68" y="52" width="18" height="32" rx="9" fill="#EE5834"/>
    <rect x="116" y="52" width="18" height="32" rx="9" fill="#EE5834"/>

    <!-- Three bold entry bars + vermilion check dot -->
    <rect x="68" y="108" width="84" height="14" rx="7" fill="#13323B"/>
    <rect x="68" y="138" width="92" height="14" rx="7" fill="#13323B"/>
    <rect x="68" y="168" width="56" height="14" rx="7" fill="#13323B"/>
    <circle cx="148" cy="175" r="8.5" fill="#EE5834"/>
  </g>

  <!-- Mirrored cute pollen-bee perched on the upper-right corner facing the card -->
  <g id="corner-bee" transform="translate(186 78) scale(-0.92 0.92) rotate(14)">
    <!-- Far muted wing behind -->
    <path d="M -18 -14 C -36 -22 -48 -14 -45 -2 C -42 10 -24 14 -10 8 Z" fill="#D5CDB8"/>

    <!-- Cute curved antenna in warm saffron so it pops cleanly on #13323B -->
    <path d="M 21 -14 C 24 -24 32 -29 39 -26 C 42 -24 42 -20 39 -19 C 33 -18 29 -13 28 -7 Z" fill="#FFBA1A"/>

    <!-- Unified plump organic body with clean rounded silhouette + dark petrol outline for contrast against card -->
    <path d="
      M -24 -4
      C -33 6 -36 18 -31 27
      C -23 39 7 41 24 27
      C 36 17 42 2 39 -9
      C 36 -20 24 -26 12 -23
      C -2 -20 -16 -13 -24 -4 Z" fill="#13323B" stroke="#13323B" stroke-width="6" stroke-linejoin="round"/>

    <!-- Generous warm golden body band -->
    <path d="
      M -15 -11
      C -5 -18 6 -21 15 -20
      C 8 -7 7 8 12 22
      C 15 28 19 31 21 31
      C 12 37 0 38 -11 35
      C -21 28 -25 16 -22 3
      C -21 -3 -19 -8 -15 -11 Z" fill="#FFBA1A"/>

    <!-- Plump framed near wing -->
    <path d="
      M 11 -14
      C 15 -18 13 -26 5 -35
      C -6 -46 -22 -49 -31 -41
      C -39 -34 -37 -20 -28 -12
      C -18 -3 -1 0 11 -14 Z" fill="#13323B"/>
    <path d="
      M 8 -16
      C 11 -19 8 -25 2 -31
      C -7 -40 -20 -42 -26 -37
      C -32 -31 -30 -21 -23 -15
      C -15 -8 -1 -7 8 -16 Z" fill="#FFF8EC"/>

    <!-- Friendly bright eye -->
    <circle cx="28" cy="-4" r="3.8" fill="#FFF8EC"/>
  </g>
</svg>
