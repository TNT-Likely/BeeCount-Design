<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 折角账页（扁平插画精修版）</title>
  <desc id="description">蜜黄底上，一张右下角折起的暖白账页，右上角停着一只轻盈干净的扁平插画小蜜蜂。</desc>
  <rect id="background" width="256" height="256" fill="#FBE5A8"/>

  <!-- Clean flat ledger sheet with folded corner -->
  <g id="ledger-sheet">
    <path d="
      M 52 46
      H 184
      Q 196 46 196 58
      V 160
      L 140 216
      H 52
      Q 40 216 40 204
      V 58
      Q 40 46 52 46 Z" fill="#FFFBF3"/>

    <!-- Minimalist ledger bars -->
    <rect x="64" y="78" width="58" height="12" rx="6" fill="#1C2E36"/>
    <rect x="64" y="106" width="84" height="12" rx="6" fill="#DDD0B8"/>
    <rect x="64" y="134" width="74" height="12" rx="6" fill="#DDD0B8"/>
    <rect x="64" y="162" width="46" height="12" rx="6" fill="#EC5331"/>

    <!-- Folded corner triangle -->
    <path d="M 140 216 V 172 Q 140 160 152 160 H 196 Z" fill="#E6D5B5"/>
  </g>

  <!-- Refined modern flat-editorial 3/4 bumblebee (clean, poised, neither ugly nor childish) -->
  <g id="editorial-bee" transform="translate(182 72)">
    <!-- Soft layered un-outlined cream wings -->
    <path d="M 10 -12 C 14 -35 36 -44 45 -33 C 52 -24 39 -6 19 -2 Z" fill="#E9DEC8"/>
    <path d="M -2 -14 C -4 -39 16 -50 28 -38 C 39 -27 26 -7 6 -5 Z" fill="#FFFDF8"/>

    <!-- Sleek plump golden body with clean flat ink stripes (no thick cartoon border) -->
    <g transform="rotate(14)">
      <defs>
        <ellipse id="fp-clean-body" cx="12" cy="8" rx="27" ry="20"/>
        <clipPath id="fp-clean-clip"><use href="#fp-clean-body"/></clipPath>
      </defs>
      <use href="#fp-clean-body" fill="#F8AF14"/>
      <g clip-path="url(#fp-clean-clip)">
        <path d="M 5 -14 C 11 -1 11 17 5 31 L 14 31 C 20 17 20 -1 14 -14 Z" fill="#1C2E36"/>
        <path d="M 22 -10 C 27 1 27 15 22 27 L 30 27 C 34 15 34 1 30 -10 Z" fill="#1C2E36"/>
      </g>
      <path d="M 37 6 L 43 9 L 37 13 Z" fill="#1C2E36"/>
    </g>

    <!-- Well-proportioned warm golden head with calm editorial eye & subtle dark cap -->
    <g transform="translate(-12 1)">
      <path d="M -5 -18 C -9 -29 -17 -33 -23 -29 C -25 -27 -24 -24 -21 -24 C -16 -24 -11 -20 -8 -14 Z" fill="#1C2E36"/>
      <path d="M 6 -19 C 5 -29 0 -35 -6 -32 C -8 -31 -8 -28 -5 -28 C 0 -27 3 -23 3 -17 Z" fill="#1C2E36"/>

      <defs>
        <path id="fp-clean-head" d="
          M 0 -20
          C 15 -20 24 -10 24 3
          C 24 15 14 23 0 23
          C -15 23 -23 14 -23 2
          C -23 -11 -15 -20 0 -20 Z"/>
        <clipPath id="fp-clean-head-clip"><use href="#fp-clean-head"/></clipPath>
      </defs>
      <use href="#fp-clean-head" fill="#F8AF14"/>
      <g clip-path="url(#fp-clean-head-clip)">
        <!-- Subtle top cap -->
        <path d="M -16 -12 C -8 -22 8 -22 16 -12 C 6 -15 -6 -15 -16 -12 Z" fill="#1C2E36"/>
      </g>

      <!-- Calm, poised dark-petrol oval eyes looking toward the ledger -->
      <ellipse cx="-10" cy="2" rx="3.4" ry="4.8" fill="#1C2E36"/>
      <ellipse cx="6" cy="2.5" rx="3.4" ry="4.8" fill="#1C2E36"/>
    </g>
  </g>
</svg>
