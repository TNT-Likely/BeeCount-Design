<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 折角账页（卡通萌版）</title>
  <desc id="description">蜜黄底上，一张右下角折起的米白账页，右上角停着一只圆脸腮红的卡通小蜜蜂。</desc>
  <rect id="background" width="256" height="256" fill="#FCE7AD"/>

  <!-- Ledger sheet with folded bottom-right corner -->
  <g id="ledger-sheet">
    <path d="
      M 52 46
      H 184
      Q 196 46 196 58
      V 160
      L 140 216
      H 52
      Q 40 216 40 204
      V 58
      Q 40 46 52 46 Z" fill="#FFFDF7" stroke="#E2D2B4" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Minimalist ledger bars -->
    <rect x="64" y="78" width="58" height="12" rx="6" fill="#2A3E47"/>
    <rect x="64" y="106" width="84" height="12" rx="6" fill="#DDD0B8"/>
    <rect x="64" y="134" width="74" height="12" rx="6" fill="#DDD0B8"/>
    <rect x="64" y="162" width="46" height="12" rx="6" fill="#EE5533"/>

    <!-- Folded corner triangle -->
    <path d="M 140 216 V 172 Q 140 160 152 160 H 196 Z" fill="#E6D5B5" stroke="#D5C2A0" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Cute chubby 3/4 cartoon bee perched cleanly on the upper-right sheet corner -->
  <g id="cartoon-bee" transform="translate(182 72)">
    <!-- Soft puffy wings -->
    <path d="M 10 -14 C 14 -38 38 -48 48 -36 C 56 -26 42 -6 20 -2 Z" fill="#F5EEDB" stroke="#3B2316" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -2 -16 C -4 -42 18 -54 30 -42 C 42 -30 28 -8 6 -6 Z" fill="#FFFFFF" stroke="#3B2316" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Plump golden egg body with two rounded cocoa-brown stripes -->
    <g transform="rotate(14)">
      <defs>
        <ellipse id="fp-body" cx="12" cy="8" rx="28" ry="22"/>
        <clipPath id="fp-body-clip"><use href="#fp-body"/></clipPath>
      </defs>
      <use href="#fp-body" fill="#FFC928"/>
      <g clip-path="url(#fp-body-clip)">
        <path d="M 6 -16 C 12 -2 12 18 6 34 L 15 34 C 21 18 21 -2 15 -16 Z" fill="#3B2316"/>
        <path d="M 24 -12 C 29 0 29 16 24 28 L 32 28 C 36 16 36 0 32 -12 Z" fill="#3B2316"/>
        <ellipse cx="12" cy="26" rx="26" ry="10" fill="#F29F05" opacity="0.45"/>
      </g>
      <use href="#fp-body" fill="none" stroke="#3B2316" stroke-width="4.8"/>
      <path d="M 38 6 L 45 9 L 38 14 Z" fill="#3B2316"/>
    </g>

    <!-- Chubby mochi cartoon head -->
    <g transform="translate(-14 0)">
      <path d="M -6 -19 C -10 -31 -20 -35 -26 -30" fill="none" stroke="#3B2316" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="-27" cy="-29" r="4.5" fill="#3B2316"/>
      <path d="M 6 -20 C 5 -32 -1 -38 -7 -35" fill="none" stroke="#3B2316" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="-8" cy="-34" r="4.2" fill="#3B2316"/>

      <path d="
        M 0 -22
        C 16 -22 26 -12 27 2
        C 28 15 19 24 4 25
        C -12 26 -24 18 -25 4
        C -26 -11 -16 -22 0 -22 Z" fill="#FFC928" stroke="#3B2316" stroke-width="4.8"/>

      <circle cx="-11" cy="1" r="5" fill="#3B2316"/>
      <circle cx="-12.5" cy="-0.8" r="1.9" fill="#FFFFFF"/>
      <circle cx="8" cy="2" r="5" fill="#3B2316"/>
      <circle cx="6.5" cy="0.2" r="1.9" fill="#FFFFFF"/>

      <ellipse cx="-18" cy="9" rx="5" ry="3.2" fill="#FF8468" opacity="0.82"/>
      <ellipse cx="14" cy="10" rx="5" ry="3.2" fill="#FF8468" opacity="0.82"/>
      <path d="M -5 9 Q -1.5 13 2 9" fill="none" stroke="#3B2316" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
