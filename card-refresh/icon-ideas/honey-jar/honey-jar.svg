<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 蜜罐守账（卡通萌版）</title>
  <desc id="description">暖燕麦底上，一只圆脸腮红的卡通小蜜蜂双手扶在半满蜂蜜的奶白陶罐口往下看，罐旁挂着朱红小签。</desc>
  <rect id="background" width="256" height="256" fill="#F0DAB7"/>

  <!-- Cute puffy wings behind the perched cartoon bee -->
  <g id="wings">
    <path d="M 96 86 C 58 88 38 68 48 48 C 58 28 90 42 104 76 Z" fill="#FFFFFF" stroke="#3B2316" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 160 86 C 198 88 218 68 208 48 C 198 28 166 42 152 76 Z" fill="#FFFFFF" stroke="#3B2316" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- Plump striped bee back peeking behind pot rim -->
  <g id="bee-body">
    <ellipse cx="128" cy="100" rx="38" ry="26" fill="#FFC928" stroke="#3B2316" stroke-width="5"/>
    <path d="M 95 98 Q 128 110 161 98" fill="none" stroke="#3B2316" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Cute mochi-cheeked cartoon bee head peeking above the rim -->
  <g id="bee-head">
    <!-- Bouncy short antennae -->
    <path d="M 110 46 C 105 33 95 28 88 33" fill="none" stroke="#3B2316" stroke-width="5" stroke-linecap="round"/>
    <circle cx="87" cy="34" r="5" fill="#3B2316"/>
    <path d="M 146 46 C 151 33 161 28 168 33" fill="none" stroke="#3B2316" stroke-width="5" stroke-linecap="round"/>
    <circle cx="169" cy="34" r="5" fill="#3B2316"/>

    <defs>
      <path id="hj-head" d="
        M 128 41
        C 152 41 168 53 173 72
        C 177 89 169 104 152 109
        C 140 112 116 112 104 109
        C 87 104 79 89 83 72
        C 88 53 104 41 128 41 Z"/>
      <clipPath id="hj-head-clip"><use href="#hj-head"/></clipPath>
    </defs>

    <use href="#hj-head" fill="#FFC928"/>
    <g clip-path="url(#hj-head-clip)">
      <ellipse cx="128" cy="110" rx="48" ry="14" fill="#F29F05" opacity="0.55"/>
      <ellipse cx="120" cy="57" rx="22" ry="9" fill="#FFE47A" opacity="0.75"/>
    </g>
    <use href="#hj-head" fill="none" stroke="#3B2316" stroke-width="4.8"/>

    <!-- Happy sparkling eyes glancing down into the honey pot -->
    <circle cx="107" cy="81" r="6.8" fill="#3B2316"/>
    <circle cx="105" cy="79" r="2.5" fill="#FFFFFF"/>
    <circle cx="149" cy="81" r="6.8" fill="#3B2316"/>
    <circle cx="147" cy="79" r="2.5" fill="#FFFFFF"/>

    <!-- Rosy cheeks & tiny happy mouth -->
    <ellipse cx="94" cy="90" rx="7" ry="4.2" fill="#FF8468" opacity="0.8"/>
    <ellipse cx="162" cy="90" rx="7" ry="4.2" fill="#FF8468" opacity="0.8"/>
    <path d="M 122 88 Q 125 92 128 89 Q 131 92 134 88" fill="none" stroke="#3B2316" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Honey pot -->
  <g id="honey-pot">
    <defs>
      <path id="pot-body" d="
        M 84 118
        H 172
        C 194 131 205 153 203 178
        C 201 204 180 221 152 224
        H 104
        C 76 221 55 204 53 178
        C 51 153 62 131 84 118 Z"/>
      <clipPath id="pot-clip">
        <use href="#pot-body"/>
      </clipPath>
    </defs>

    <use href="#pot-body" fill="#FFFDF7"/>
    <g clip-path="url(#pot-clip)">
      <!-- Golden honey fill -->
      <path d="M 46 160 Q 87 152 128 160 T 210 160 L 210 232 L 46 232 Z" fill="#F9A800"/>
      <!-- Soft cream shine on pot shoulder -->
      <path d="M 75 174 C 71 184 72 195 79 204" fill="none" stroke="#FFE47A" stroke-width="6" stroke-linecap="round"/>
    </g>
    <use href="#pot-body" fill="none" stroke="#3B2316" stroke-width="5" stroke-linejoin="round"/>

    <!-- Pot collar rim -->
    <rect x="75" y="106" width="106" height="17" rx="8.5" fill="#2A3E47" stroke="#3B2316" stroke-width="4.5"/>

    <!-- Vermilion ledger tag -->
    <path d="M 164 122 L 171 134" stroke="#3B2316" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 164 131 L 184 130 L 188 158 L 168 161 L 161 136 Z" fill="#EE5533" stroke="#3B2316" stroke-width="3.2" stroke-linejoin="round"/>
    <circle cx="171" cy="137" r="2.5" fill="#FFFDF7"/>
  </g>

  <!-- Two cute little golden paws resting happily on the pot rim -->
  <g id="paws">
    <ellipse cx="98" cy="110" rx="10" ry="7.5" fill="#FFC928" stroke="#3B2316" stroke-width="4.2"/>
    <ellipse cx="158" cy="110" rx="10" ry="7.5" fill="#FFC928" stroke="#3B2316" stroke-width="4.2"/>
  </g>
</svg>
