<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 蜜罐守账</title>
  <desc id="description">暖燕麦色底上，一只小蜜蜂俯身趴在半满金黄蜂蜜的奶白陶罐口，罐右侧垂着一枚朱红小签。</desc>
  <rect id="background" width="256" height="256" fill="#EBD3AE"/>

  <defs>
    <path id="pot-body" d="
      M 86 112
      H 170
      C 192 126 203 148 201 174
      C 199 201 178 218 152 221
      H 104
      C 78 218 57 201 55 174
      C 53 148 64 126 86 112 Z"/>
    <clipPath id="pot-clip">
      <use href="#pot-body"/>
    </clipPath>
  </defs>

  <!-- Honey pot (no uniform cartoon outline; solid flat editorial shapes) -->
  <g id="honey-pot">
    <use href="#pot-body" fill="#FFF8EB"/>
    <g clip-path="url(#pot-clip)">
      <!-- Honey fill ~58% full with soft meniscus curve -->
      <path d="M 48 154 Q 88 147 128 154 T 208 154 L 208 228 L 48 228 Z" fill="#F6A600"/>
      <!-- Subtle warm base band grounding the pot -->
      <rect x="48" y="213" width="160" height="14" fill="#13323B"/>
    </g>

    <!-- Thick deep-petrol pot rim -->
    <rect x="78" y="100" width="100" height="16" rx="8" fill="#13323B"/>

    <!-- Vermilion ledger tag hanging off right neck -->
    <path d="M 164 114 L 171 128" stroke="#13323B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 164 125 L 184 124 L 188 153 L 168 156 L 161 130 Z" fill="#EC5331"/>
    <circle cx="171" cy="131" r="2.3" fill="#FFF8EB"/>
  </g>

  <!-- Plump little bee leaning over the left rim, peering into the honey pot -->
  <g id="bee">
    <!-- Far wing (deep petrol like pollen-bee for crisp figure-ground contrast) -->
    <path d="M 96 67 C 72 60 56 41 64 30 C 72 19 94 31 104 56 Z" fill="#13323B"/>
    <!-- Near ivory wing -->
    <path d="M 103 68 C 85 52 80 29 93 24 C 106 19 118 39 115 64 Z" fill="#FFF8EB"/>

    <!-- Tilted plump striped bee body arched above the rim -->
    <g transform="translate(115 74) rotate(18)">
      <!-- Plump dark-petrol outer silhouette -->
      <path d="M -31 4 C -31 -13 -15 -22 4 -22 C 22 -22 35 -11 35 4 C 35 18 21 27 2 27 C -16 27 -27 19 -34 8 Z" fill="#13323B"/>
      <!-- Clean golden abdomen fill + two crisp dark stripes -->
      <path d="M -22 4 C -22 -10 -10 -17 4 -17 C 18 -17 27 -9 27 4 C 27 15 17 22 2 22 C -12 22 -22 15 -22 4 Z" fill="#F6A600"/>
      <path d="M -11 -16 C -6 -4 -6 10 -11 22" fill="none" stroke="#13323B" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M 4 -18 C 9 -4 9 11 4 23" fill="none" stroke="#13323B" stroke-width="7.5" stroke-linecap="round"/>
      <!-- Clean dark head + bright cream eye peering down into the pot -->
      <circle cx="22" cy="4" r="14" fill="#13323B"/>
      <circle cx="26" cy="3" r="3" fill="#FFF8EB"/>
      <!-- Tiny curved feeler -->
      <path d="M 25 -8 C 29 -18 38 -20 42 -14" fill="none" stroke="#13323B" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
