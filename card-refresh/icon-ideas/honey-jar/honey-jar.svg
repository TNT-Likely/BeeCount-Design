<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 蜜罐守账</title>
  <desc id="description">暖燕麦色底上，一只圆润可爱的小蜜蜂趴在半满金黄蜂蜜的陶罐口往下看，罐右侧垂着朱红小签。</desc>
  <rect id="background" width="256" height="256" fill="#EBD3AE"/>

  <defs>
    <path id="pot-body" d="
      M 86 116
      H 170
      C 192 129 203 151 201 176
      C 199 202 178 219 152 222
      H 104
      C 78 219 57 202 55 176
      C 53 151 64 129 86 116 Z"/>
    <clipPath id="pot-clip">
      <use href="#pot-body"/>
    </clipPath>
  </defs>

  <!-- Honey pot -->
  <g id="honey-pot">
    <use href="#pot-body" fill="#FFF8EB"/>
    <g clip-path="url(#pot-clip)">
      <path d="M 48 157 Q 88 150 128 157 T 208 157 L 208 230 L 48 230 Z" fill="#F6A600"/>
      <rect x="48" y="215" width="160" height="14" fill="#13323B"/>
    </g>
    <rect x="78" y="104" width="100" height="16" rx="8" fill="#13323B"/>
    <path d="M 164 118 L 171 131" stroke="#13323B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 164 128 L 184 127 L 188 155 L 168 158 L 161 133 Z" fill="#EC5331"/>
    <circle cx="171" cy="134" r="2.3" fill="#FFF8EB"/>
  </g>

  <!-- Chubby, adorable pollen-bee-style bumblebee perched on the pot rim -->
  <g id="bee" transform="translate(117 77) rotate(12)">
    <!-- Far paddle wing behind -->
    <path d="M -18 -14 C -36 -22 -48 -14 -45 -2 C -42 10 -24 14 -10 8 Z" fill="#13323B"/>

    <!-- Single cute curved antenna -->
    <path d="M 21 -14 C 24 -24 32 -29 39 -26 C 42 -24 42 -20 39 -19 C 33 -18 29 -13 28 -7 Z" fill="#13323B"/>

    <!-- Unified plump organic bee body with clean smooth rear curve -->
    <path d="
      M -24 -4
      C -33 6 -36 18 -31 27
      C -23 39 7 41 24 27
      C 36 17 42 2 39 -9
      C 36 -20 24 -26 12 -23
      C -2 -20 -16 -13 -24 -4 Z" fill="#13323B"/>

    <!-- One generous warm golden honey band curving with the body -->
    <path d="
      M -12 -13
      C -4 -17 4 -19 10 -19
      C 4 -7 3 8 8 20
      C 12 27 17 31 20 31
      C 12 37 2 39 -8 37
      C -18 30 -22 18 -20 4
      C -19 -3 -16 -9 -12 -13 Z" fill="#F6A600"/>

    <!-- Plump framed near wing -->
    <path d="
      M 11 -14
      C 15 -18 13 -26 5 -35
      C -6 -46 -22 -49 -31 -41
      C -39 -34 -37 -20 -28 -12
      C -18 -3 -1 0 11 -14 Z" fill="#13323B"/>
    <path d="
      M 8 -16
      C 11 -19 8 -25 2 -31
      C -7 -40 -20 -42 -26 -37
      C -32 -31 -30 -21 -23 -15
      C -15 -8 -1 -7 8 -16 Z" fill="#FFF8EB"/>

    <!-- Friendly bright eye peeking down at the honey -->
    <circle cx="28" cy="-4" r="3.8" fill="#FFF8EB"/>
  </g>
</svg>
