<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 小账房（扁平插画精修版）</title>
  <desc id="description">暖燕麦色底上，一只比例匀称的扁平插画小蜜蜂捧着摊开的账本，垂眼看着刚用红铅笔记下的 6.50。</desc>
  <rect id="background" width="256" height="256" fill="#FCE3BD"/>

  <!-- Soft un-outlined layered cream wings behind shoulders -->
  <g id="wings">
    <path d="M 88 122 C 48 126 26 112 30 92 C 34 72 68 72 96 104 Z" fill="#EFE2CA"/>
    <path d="M 168 122 C 208 126 230 112 226 92 C 222 72 188 72 160 104 Z" fill="#EFE2CA"/>
    <path d="M 94 112 C 54 104 32 80 42 62 C 52 44 86 58 104 96 Z" fill="#FFFBF3"/>
    <path d="M 162 112 C 202 104 224 80 214 62 C 204 44 170 58 152 96 Z" fill="#FFFBF3"/>
  </g>

  <!-- Plump striped bee lower abdomen peeking cleanly under the book -->
  <g id="belly">
    <ellipse cx="128" cy="186" rx="46" ry="32" fill="#1C2E36"/>
    <path d="M 86 184 Q 128 199 170 184 Q 165 202 128 208 Q 91 202 86 184 Z" fill="#F7AF18"/>
  </g>

  <!-- Refined flat-editorial bee head (no cartoon outlines, no pink cheeks, no w-mouth) -->
  <g id="head">
    <!-- Tidy tapered antennae -->
    <path d="M 110 53 C 105 37 94 31 86 35 C 83 37 83 41 87 42 C 94 42 100 47 104 56 Z" fill="#1C2E36"/>
    <path d="M 146 53 C 151 37 162 31 170 35 C 173 37 173 41 169 42 C 162 42 156 47 152 56 Z" fill="#1C2E36"/>

    <!-- Plush dark-petrol collar/shoulders -->
    <ellipse cx="128" cy="126" rx="48" ry="26" fill="#1C2E36"/>

    <!-- Clean warm marigold head with subtle natural honey warmth -->
    <defs>
      <path id="pb-head-clean" d="
        M 128 48
        C 155 48 175 63 179 86
        C 183 108 168 130 128 130
        C 88 130 73 108 77 86
        C 81 63 101 48 128 48 Z"/>
      <clipPath id="pb-head-clean-clip"><use href="#pb-head-clean"/></clipPath>
    </defs>

    <use href="#pb-head-clean" fill="#F8AF14"/>
    <g clip-path="url(#pb-head-clean-clip)">
      <!-- Subtle top dark-petrol bee cap for unmistakable honeybee look without side cheeks -->
      <path d="M 88 64 C 102 47 115 44 128 44 C 141 44 154 47 168 64 C 152 58 140 57 128 60 C 116 57 104 58 88 64 Z" fill="#1C2E36"/>
      <!-- Very gentle warm amber chin depth -->
      <ellipse cx="128" cy="128" rx="50" ry="12" fill="#E39307" opacity="0.45"/>
    </g>

    <!-- Calm, attentive oval eyes glancing down toward the ledger (editorial deadpan warmth) -->
    <ellipse cx="105" cy="96" rx="5.2" ry="7.2" transform="rotate(-8 105 96)" fill="#1C2E36"/>
    <ellipse cx="151" cy="96" rx="5.2" ry="7.2" transform="rotate(8 151 96)" fill="#1C2E36"/>
  </g>

  <!-- Open Pocket Account Ledger (clean flat spot colors, no cartoon outlines) -->
  <g id="ledger">
    <!-- Vermilion bookmark ribbon -->
    <path d="M 146 196 H 161 V 227 L 153.5 220 L 146 227 Z" fill="#EC5331"/>

    <!-- Deep petrol hardcover cradle -->
    <path d="
      M 44 146
      C 60 136 106 136 128 150
      C 150 136 196 136 212 146
      L 206 201
      C 198 208 180 204 156 204
      C 142 204 134 209 128 210
      C 122 209 114 204 100 204
      C 76 204 58 208 50 201 Z" fill="#1C2E36"/>

    <!-- Cream open page spread -->
    <path d="
      M 51 142
      C 66 130 108 132 128 148
      C 148 132 190 130 205 142
      L 199 192
      C 178 188 144 190 128 200
      C 112 190 78 188 57 192 Z" fill="#FFFBF3"/>

    <!-- Page thickness edge -->
    <path d="
      M 57 192
      C 78 188 112 190 128 200
      C 144 190 178 188 199 192
      L 198 198
      C 178 194 144 196 128 206
      C 112 196 78 194 58 198 Z" fill="#E8D8BC"/>

    <!-- Center spine crease -->
    <path d="M 128 148 L 128 200" stroke="#DFCDAE" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Left page: two tidy teal entry marks -->
    <rect x="68" y="154" width="38" height="5.5" rx="2.75" fill="#218386"/>
    <rect x="68" y="168" width="32" height="5.5" rx="2.75" fill="#218386"/>

    <!-- Right page: teal vertical ruling + 18.00 / 6.50 -->
    <line x1="135" y1="148" x2="135" y2="186" stroke="#218386" stroke-width="2.2" stroke-linecap="round"/>
    <text x="140" y="162" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif" font-size="12.5" font-weight="700" fill="#1C2E36">18.00</text>
    <text x="144" y="180" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif" font-size="12.5" font-weight="700" fill="#1C2E36">6.50</text>
  </g>

  <!-- Neat dark-petrol mitten paws holding the ledger and chunky red pencil -->
  <g id="paws-and-pencil">
    <ellipse cx="47" cy="173" rx="11" ry="9" fill="#1C2E36"/>

    <g transform="translate(194 160) rotate(36)">
      <path d="M -5 18 L 5 18 L 0 29 Z" fill="#F2D7B4"/>
      <path d="M -2.2 24 L 2.2 24 L 0 29 Z" fill="#1C2E36"/>
      <rect x="-5" y="-14" width="10" height="32" rx="4" fill="#EC5331"/>
    </g>

    <ellipse cx="207" cy="166" rx="11" ry="9" fill="#1C2E36"/>
  </g>
</svg>
