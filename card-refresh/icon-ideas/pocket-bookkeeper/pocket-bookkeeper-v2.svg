<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">蜜蜂记账 · 小账房（卡通萌版）</title>
  <desc id="description">暖燕麦底上，一只圆脸腮红的卡通小蜜蜂双手捧着摊开的账本，正用红铅笔在 6.50 旁边认真记账。</desc>
  <rect id="background" width="256" height="256" fill="#FCE5BE"/>

  <!-- Soft puffy cartoon wings behind shoulders -->
  <g id="wings">
    <path d="M 88 122 C 44 128 20 112 24 90 C 28 68 64 68 94 102 Z" fill="#FFFDF7" stroke="#E2D3B8" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 168 122 C 212 128 236 112 232 90 C 228 68 192 68 162 102 Z" fill="#FFFDF7" stroke="#E2D3B8" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 92 108 C 52 100 28 74 38 56 C 48 38 84 52 102 92 Z" fill="#FFFFFF" stroke="#3B2316" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 164 108 C 204 100 228 74 218 56 C 208 38 172 52 154 92 Z" fill="#FFFFFF" stroke="#3B2316" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- Plump golden & cocoa-brown striped body peeking under the book -->
  <g id="body">
    <ellipse cx="128" cy="186" rx="48" ry="34" fill="#FFC928" stroke="#3B2316" stroke-width="5"/>
    <path d="M 84 190 Q 128 208 172 190 Q 166 211 128 218 Q 90 211 84 190 Z" fill="#3B2316"/>
  </g>

  <!-- Cute mochi-cheeked cartoon bee head -->
  <g id="head">
    <!-- Bouncy little antennae with round bobbles -->
    <path d="M 108 50 C 102 34 90 29 82 35" fill="none" stroke="#3B2316" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="80" cy="36" r="6" fill="#3B2316"/>
    <path d="M 148 50 C 154 34 166 29 174 35" fill="none" stroke="#3B2316" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="176" cy="36" r="6" fill="#3B2316"/>

    <!-- Squishy mochi bun head shape (wider chubby lower cheeks) -->
    <defs>
      <path id="pb-head-shape" d="
        M 128 44
        C 156 44 176 58 182 82
        C 188 104 180 124 160 132
        C 146 137 110 137 96 132
        C 76 124 68 104 74 82
        C 80 58 100 44 128 44 Z"/>
      <clipPath id="pb-head-clip"><use href="#pb-head-shape"/></clipPath>
    </defs>

    <use href="#pb-head-shape" fill="#FFC928"/>
    <g clip-path="url(#pb-head-clip)">
      <!-- Soft warm marigold lower belly/chin shadow -->
      <ellipse cx="128" cy="134" rx="58" ry="20" fill="#F29F05" opacity="0.55"/>
      <!-- Soft creamy forehead highlight -->
      <ellipse cx="118" cy="64" rx="28" ry="12" fill="#FFE47A" opacity="0.75"/>
      <!-- Subtle cute little cocoa hair tuft at top crown -->
      <path d="M 104 42 Q 128 56 152 42 Z" fill="#3B2316"/>
    </g>
    <use href="#pb-head-shape" fill="none" stroke="#3B2316" stroke-width="5"/>

    <!-- Sparkly wide-set cute eyes placed low on the face -->
    <circle cx="101" cy="94" r="8.5" fill="#3B2316"/>
    <circle cx="98.5" cy="91" r="3.2" fill="#FFFFFF"/>
    <circle cx="104" cy="97.5" r="1.4" fill="#FFFFFF"/>

    <circle cx="155" cy="94" r="8.5" fill="#3B2316"/>
    <circle cx="152.5" cy="91" r="3.2" fill="#FFFFFF"/>
    <circle cx="158" cy="97.5" r="1.4" fill="#FFFFFF"/>

    <!-- Rosy peachy cheeks -->
    <ellipse cx="86" cy="105" rx="8.5" ry="5" fill="#FF8468" opacity="0.78"/>
    <ellipse cx="170" cy="105" rx="8.5" ry="5" fill="#FF8468" opacity="0.78"/>

    <!-- Sweet tiny little cat/bee mouth -->
    <path d="M 121 102 Q 124.5 107 128 103 Q 131.5 107 135 102" fill="none" stroke="#3B2316" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Open Pocket Account Ledger -->
  <g id="ledger">
    <!-- Vermilion bookmark ribbon -->
    <path d="M 146 196 H 161 V 227 L 153.5 221 L 146 227 Z" fill="#EE5533" stroke="#3B2316" stroke-width="3" stroke-linejoin="round"/>

    <!-- Warm espresso-brown / petrol hardcover cradle -->
    <path d="
      M 44 146
      C 60 136 106 136 128 150
      C 150 136 196 136 212 146
      L 206 201
      C 198 208 180 204 156 204
      C 142 204 134 209 128 210
      C 122 209 114 204 100 204
      C 76 204 58 208 50 201 Z" fill="#2A3E47" stroke="#3B2316" stroke-width="4" stroke-linejoin="round"/>

    <!-- Cream open page spread -->
    <path d="
      M 51 142
      C 66 130 108 132 128 148
      C 148 132 190 130 205 142
      L 199 192
      C 178 188 144 190 128 200
      C 112 190 78 188 57 192 Z" fill="#FFFDF7"/>

    <!-- Page thickness edge -->
    <path d="
      M 57 192
      C 78 188 112 190 128 200
      C 144 190 178 188 199 192
      L 198 198
      C 178 194 144 196 128 206
      C 112 196 78 194 58 198 Z" fill="#E8D8BC"/>

    <!-- Center spine -->
    <path d="M 128 148 L 128 200" stroke="#DFCDAE" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left page: two neat teal entry marks -->
    <rect x="68" y="154" width="38" height="5.5" rx="2.75" fill="#23888B"/>
    <rect x="68" y="168" width="32" height="5.5" rx="2.75" fill="#23888B"/>

    <!-- Right page: teal ruling + 18.00 / 6.50 -->
    <line x1="135" y1="148" x2="135" y2="186" stroke="#23888B" stroke-width="2.2" stroke-linecap="round"/>
    <text x="140" y="162" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif" font-size="12.5" font-weight="700" fill="#2A3E47">18.00</text>
    <text x="144" y="180" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif" font-size="12.5" font-weight="700" fill="#2A3E47">6.50</text>
  </g>

  <!-- Stubby cute golden paws holding the ledger and chunky red pencil -->
  <g id="paws-and-pencil">
    <ellipse cx="47" cy="173" rx="11.5" ry="9.5" fill="#FFC928" stroke="#3B2316" stroke-width="4.5"/>

    <g transform="translate(194 160) rotate(36)">
      <path d="M -5 18 L 5 18 L 0 29 Z" fill="#F2D7B4" stroke="#3B2316" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M -2.2 24 L 2.2 24 L 0 29 Z" fill="#3B2316"/>
      <rect x="-5" y="-14" width="10" height="32" rx="4" fill="#EE5533" stroke="#3B2316" stroke-width="3"/>
    </g>

    <ellipse cx="207" cy="166" rx="11.5" ry="9.5" fill="#FFC928" stroke="#3B2316" stroke-width="4.5"/>
  </g>
</svg>
